services:
  - type: web
    name: anonnet
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: ADMIN_KEY
        value: anonadmin2026
